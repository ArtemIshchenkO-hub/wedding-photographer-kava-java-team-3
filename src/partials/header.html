<header class="header" id="header">
  <div class="header-container">
    <a
      class="logo-link"
      href="/"
      aria-label="Maria Kovalenko Photography"
    >
      <img
        src="/favicon.svg"
        alt="Maria Kovalenko Photography"
        class="logo"
        width="41"
        height="32"
      />
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#about">About Me</a>
      <a href="#benefits">Benefits</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#faq">FAQ</a>
    </nav>

    <a class="desktop-book-btn" href="#contacts">Book a Session</a>

    <button
      class="menu"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="mobile-menu">
    <div class="mobile-menu-header">
      <a
        class="logo-link"
        href="/"
        aria-label="Maria Kovalenko Photography"
      >
        <img
          src="/favicon.svg"
          alt="Maria Kovalenko Photography"
          class="logo"
          width="41"
          height="32"
        />
      </a>

      <button
        class="close"
        type="button"
        aria-label="Close menu"
      >
        ✕
      </button>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a href="#about">About Me</a>
      <a href="#benefits">Benefits</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#faq">FAQ</a>
    </nav>

    <a class="mobile-book-btn" href="#contacts">
      Book a Session
    </a>
  </div>
</header>
