<section class="section contacts" id="contacts">
  <div class="container contacts-container container-decoration">
    <div class="info-wrapper">
      <h2 class="contacts-title">Let's Tell Your Story</h2>
      <p class="contacts-text">
        I can't wait to hear more about your wedding! Tell me about your plans,
        and I'll be in touch to discuss how we can create magic together.
      </p>
      <ul class="contacts-list">
        <li class="contacts-item">
          <a class="contacts-link" href="mailto:info@mariakovalenko.com">
            <svg
              class="contacts-icon"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <use href="./img/sprite.svg#icon-mail"></use>
            </svg>
            info@mariakovalenko.com
          </a>
        </li>
        <li class="contacts-item">
          <a class="contacts-link" href="tel:+405551234567">
            <svg
              class="contacts-icon"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <use href="./img/sprite.svg#icon-phone"></use>
            </svg>
            +40 (555) 123-4567
          </a>
        </li>
        <li class="contacts-item">
          <a
            class="contacts-link"
            href="https://www.google.com/maps/search/?api=1&query=Odesa+National+Academic+Opera+and+Ballet+Theatre,+Theatralnyi+Provulok+1,+Odesa,+Ukraine"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              class="contacts-icon"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <use href="./img/sprite.svg#icon-location"></use>
            </svg>
            Theatralnyi Provulok, 1, Odesa, Odesa Oblast, Ukraine, 65000
          </a>
        </li>
      </ul>
    </div>

    <div class="form-wrapper">
      <form class="contacts-form" name="contacts-form">
        <label class="contacts-label">
          <span class="contacts-label-text">Name*</span>
          <input
            class="contacts-input"
            type="text"
            name="name"
            placeholder="Maria"
            autocomplete="name"
            required
            minlength="2"
            maxlength="64"
          />
          <span class="contacts-error-text"
            >Please enter your name (2–64 characters)</span
          >
        </label>
        <label class="contacts-label">
          <span class="contacts-label-text">Phone*</span>
          <input
            class="contacts-input"
            type="tel"
            name="phone"
            placeholder="380507224861"
            autocomplete="tel"
            required
            pattern="[0-9]{12}"
          />
          <span class="contacts-error-text"
            >Enter a valid phone number (12 digits, no symbols)</span
          >
        </label>
        <label class="contacts-label">
          <span class="contacts-label-text">Message</span>
          <textarea
            class="contacts-textarea"
            name="message"
            minlength="5"
            maxlength="256"
            placeholder="Tell me a little about you and your special day. Don't forget to include your wedding date, venue, and what you're most excited about..."
          ></textarea>
          <span class="contacts-error-text"
            >Message should be 5–256 characters long</span
          >
        </label>
        <button class="contacts-btn button-main" type="submit">
          Let's Talk
        </button>
      </form>
    </div>
  </div>
</section>
