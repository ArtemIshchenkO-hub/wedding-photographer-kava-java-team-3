<div class="success-modal-backdrop" id="success-modal">
  <div
    class="success-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="success-modal-title"
    tabindex="-1"
  >
    <button
      class="success-modal-close"
      type="button"
      aria-label="Close success modal"
    >
      <svg width="24" height="24" aria-hidden="true">
        <use href="./img/sprite.svg#icon-close"></use>
      </svg>
    </button>
    <div class="success-modal-content">
      <h2 class="success-modal-title" id="success-modal-title">
        Thank You for Your Inquiry!
      </h2>
      <img
        class="success-modal-image"
        sizes="(min-width: 768px) 640px, (max-width: 374px) calc(100vw - 80px), 295px"
        src="./img/success-modal.jpg"
        srcset="./img/success-modal.jpg 640w, ./img/succes-modal@2x.jpg 1280w"
        alt="Coffee, handwritten stationery and wedding photographs on light linen"
        width="295"
        height="207"
        loading="eager"
      />
      <p class="success-modal-text">
        I have received your message and I'm so excited about your interest! I
        will get in touch with you within 24-48 hours to discuss the details of
        your wedding day. In the meantime, feel free to browse my portfolio or
        follow me on Instagram for more inspiration.
      </p>
    </div>
  </div>
</div>
